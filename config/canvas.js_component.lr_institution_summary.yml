css:
  original: |
    .local-reach-count-up {
      display: inline-grid;
    }

    .local-reach-count-up__final,
    .local-reach-count-up__value {
      grid-area: 1 / 1;
      font-variant-numeric: tabular-nums;
    }

    .local-reach-count-up__final {
      opacity: 0;
    }

    .local-reach-institution-summary {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .local-reach-institution-summary__logo-wrapper {
      margin-bottom: 2.5rem;
      max-height: 100px;
      display: flex;
      align-items: center;
    }

    .local-reach-institution-summary__logo {
      max-width: 100%;
      height: auto;
      object-fit: contain;
      width: 360px;
    }

    .local-reach-institution-summary__number {
      font-size: 3.5rem;
      line-height: 1;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .local-reach-institution-summary__text {
      color: #2d2f33;
      font-size: 1.5rem;
      line-height: 1.2;
      font-weight: 400;
      margin-bottom: 1rem;
    }

    .local-reach-institution-summary__divider {
      width: 140px;
      height: 5px;
      background-color: #be9f56;
      border-radius: 2px;
    }

    @media (max-width: 1023.98px) {
      .local-reach-institution-summary__number {
        font-size: 3rem;
      }
      .local-reach-institution-summary__text {
        font-size: 1.25rem;
      }
      .local-reach-institution-summary__logo {
        width: 300px;
      }
    }
    @media (max-width: 767.98px) {
      .local-reach-institution-summary__number {
        font-weight: 400;
      }
      .local-reach-institution-summary__logo {
        width: 250px;
      }
    }
