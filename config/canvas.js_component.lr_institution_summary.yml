langcode: en
status: true
dependencies: {  }
machineName: lr_institution_summary
name: 'Local Reach: Institution summary'
required:
  - number
props:
  logo:
    title: Logo
    type: object
    $ref: 'json-schema-definitions://canvas.module/image'
    examples:
      -
        src: 'https://placehold.co/240x120@2x.png?text=Logo'
        width: 240
        height: 120
        alt: Logo
  number:
    title: Number
    type: string
    examples:
      - '25,000'
  text:
    title: Text
    type: string
    examples:
      - 'People reached this year'
  numberColor:
    title: 'Number color'
    type: string
    examples:
      - '#8C0A28'
slots: {  }
