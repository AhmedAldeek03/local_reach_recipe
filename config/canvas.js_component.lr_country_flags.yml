css:
  original: |
    .local-reach-count-up {
      display: inline-grid;
    }

    .local-reach-count-up__final,
    .local-reach-count-up__value {
      grid-area: 1 / 1;
      font-variant-numeric: tabular-nums;
    }

    .local-reach-count-up__final {
      opacity: 0;
    }

    .local-reach-countries {
      --lr-line: #0a8fb8;
      border-inline-start: 5px solid var(--lr-line);
      padding-inline-start: 1rem;
      padding-top: 32px;
      padding-bottom: 32px;
      margin-top: 32px;
    }

    .local-reach-countries__title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 18px;
      color: #4f535a;
      font-size: 1.75rem;
      line-height: 1.2;
      font-weight: 700;
    }

    /* The uploaded icon keeps its own colors. */
    .local-reach-countries__icon {
      flex: 0 0 auto;
      width: 2rem;
      height: 2rem;
      background: var(--lr-icon) center / contain no-repeat;
    }

    .local-reach-countries__list {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .local-reach-countries__item {
      margin: 0;
    }

    /* Round flags, whatever the shape of the uploaded file. */
    .local-reach-countries__flag {
      display: block;
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      object-fit: cover;
    }
    @media (max-width: 1023.98px) {
      .local-reach-figures__title {
        font-size: 1.5rem;
      }
    }
