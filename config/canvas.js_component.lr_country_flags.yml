langcode: en
status: true
dependencies: {  }
machineName: lr_country_flags
name: 'Local Reach: Country flags'
required: {  }
props:
  heading:
    title: Heading
    type: string
    examples:
      - 'Countries we work in'
  icon:
    title: Icon
    type: object
    $ref: 'json-schema-definitions://canvas.module/image'
    examples:
      -
        src: 'https://placehold.co/56x56@2x.png?text=Icon'
        width: 56
        height: 56
        alt: Icon
  flags:
    title: 'Flags (the alternative text is used as the country name)'
    type: array
    items:
      type: object
      $ref: 'json-schema-definitions://canvas.module/image'
    examples:
      -
        -
          src: 'https://placehold.co/80x80@2x.png?text=JO'
          width: 80
          height: 80
          alt: JO
        -
          src: 'https://placehold.co/80x80@2x.png?text=PS'
          width: 80
          height: 80
          alt: PS
        -
          src: 'https://placehold.co/80x80@2x.png?text=LB'
          width: 80
          height: 80
          alt: LB
  lineColor:
    title: 'Line color'
    type: string
    examples:
      - '#0a8fb8'
