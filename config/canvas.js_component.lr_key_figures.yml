langcode: en
status: true
dependencies: {  }
machineName: lr_key_figures
name: 'Local Reach: Key figures'
required:
  - numbers
props:
  heading:
    title: Heading
    type: string
    examples:
      - 'Local reach'
  icon:
    title: Icon
    type: object
    $ref: 'json-schema-definitions://canvas.module/image'
    examples:
      -
        src: 'https://placehold.co/56x56@2x.png?text=Icon'
        width: 56
        height: 56
        alt: Icon
  numbers:
    title: Numbers
    type: array
    items:
      type: string
    examples:
      -
        - '1,200'
        - 85%
        - '30'
    minItems: 1
  descriptions:
    title: 'Descriptions (same order as numbers)'
    type: array
    items:
      type: string
    examples:
      -
        - 'Families supported'
        - 'Satisfaction rate'
        - 'Partner organizations'
  numberColor:
    title: 'Number color'
    type: string
    examples:
      - '#8C0A28'
  lineColor:
    title: 'Line color'
    type: string
    examples:
      - '#BE9F56'
slots: {  }
js:
  original: |
    import { useEffect, useRef, useState } from 'preact/hooks';

    // Counts a number up from 0 when it scrolls into view, like the original
    // Local Reach blocks. Only values with exactly one number are animated
    // ("1,200", "85%", "$3.5M"); anything else is shown as is.
    const LR_DURATION = 2200;
    const LR_NUMBER = /^([^\d]*?)(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?([^\d]*)$/;

    function lrParse(text) {
      const m = text.match(LR_NUMBER);
      if (!m) return null;
      const decimals = m[3] ? m[3].length - 1 : 0;
      const target = parseFloat(m[2].replace(/,/g, '') + (m[3] || ''));
      if (!isFinite(target)) return null;
      return {
        prefix: m[1], suffix: m[4], target, decimals,
        formatter: new Intl.NumberFormat('en-US', {
          minimumFractionDigits: decimals,
          maximumFractionDigits: decimals,
          useGrouping: m[2].indexOf(',') !== -1,
        }),
      };
    }

    function lrFormat(value, data) {
      return data.prefix + data.formatter.format(value) + data.suffix;
    }

    function CountUp({ value }) {
      const text = String(value ?? '').trim();
      const data = lrParse(text);
      const ref = useRef(null);
      const [shown, setShown] = useState(data ? lrFormat(0, data) : text);

      useEffect(() => {
        if (!data) return undefined;
        const reduced = !('IntersectionObserver' in window) ||
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          setShown(text);
          return undefined;
        }
        setShown(lrFormat(0, data));
        let frame;
        const observer = new IntersectionObserver((entries) => {
          if (!entries[0].isIntersecting) return;
          observer.disconnect();
          let start = 0;
          const factor = Math.pow(10, data.decimals);
          const step = (time) => {
            if (!start) start = time;
            const progress = Math.min((time - start) / LR_DURATION, 1);
            const current = progress < 1 ? Math.floor(progress * data.target * factor) / factor : data.target;
            setShown(lrFormat(current, data));
            if (progress < 1) frame = window.requestAnimationFrame(step);
          };
          frame = window.requestAnimationFrame(step);
        }, { threshold: 1 });
        observer.observe(ref.current);
        return () => {
          observer.disconnect();
          window.cancelAnimationFrame(frame);
        };
      }, [text]);

      if (!data) return text;
      // The final value stays in the layout (transparent) so the width never
      // changes and screen readers read it; the animated value sits on top.
      return (
        <span ref={ref} className="local-reach-count-up">
          <span className="local-reach-count-up__final">{text}</span>
          <span className="local-reach-count-up__value" aria-hidden="true">{shown}</span>
        </span>
      );
    }

    export default function KeyFigures({
      heading,
      icon,
      numbers = [],
      descriptions = [],
      numberColor = '#8C0A28',
      lineColor = '#BE9F56',
    }) {
      return (
        <div
          className="local-reach-figures local-reach-figures--per-row-1"
          style={{ '--lr-number': numberColor, '--lr-line': lineColor }}
        >
          <div className="local-reach-figures__groups">
            <div className="local-reach-figures__group">
              {heading && (
                <h2 className="local-reach-figures__title">
                  {icon?.src && (
                    <span
                      className="local-reach-figures__icon"
                      style={{ '--lr-icon': `url('${icon.src}')` }}
                      aria-hidden="true"
                    />
                  )}
                  <span>{heading}</span>
                </h2>
              )}
              <ul className="local-reach-figures__list">
                {numbers.map((number, i) => (
                  <li key={i} className="local-reach-figures__item">
                    <span className="local-reach-figures__number"><CountUp value={number} /></span>
                    {descriptions[i] && (
                      <span className="local-reach-figures__description">{descriptions[i]}</span>
                    )}
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </div>
      );
    }
