css:
  original: |
    .local-reach-count-up {
      display: inline-grid;
    }

    .local-reach-count-up__final,
    .local-reach-count-up__value {
      grid-area: 1 / 1;
      font-variant-numeric: tabular-nums;
    }

    .local-reach-count-up__final {
      opacity: 0;
    }

    .local-reach-figures {
      --lr-number: #5c0a2a;
      --lr-line: #e8262b;
    }

    .local-reach-figures__groups {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 2rem;
      width: 100%;
    }

    /* 1 group per row */
    .local-reach-figures--per-row-1 .local-reach-figures__group {
      flex: 0 0 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* 2 groups per row */
    .local-reach-figures--per-row-2 .local-reach-figures__group {
      flex: 0 0 calc(50% - 1rem);
      max-width: calc(50% - 1rem);
      box-sizing: border-box;
    }

    /* 4 groups per row configuration */
    .local-reach-figures--per-row-4 .local-reach-figures__group {
      flex: 0 0 calc(25% - 1.5rem);
      max-width: calc(25% - 1.5rem);
      box-sizing: border-box;
    }

    /* Below 1280px: the 4 option follows the 2 option behaviour */
    @media (max-width: 1279.98px) {
      .local-reach-figures__groups {
        margin-top: 24px;
      }
      .local-reach-figures--per-row-4 .local-reach-figures__group {
        flex: 0 0 calc(50% - 1rem);
        max-width: calc(50% - 1rem);
        box-sizing: border-box;
      }
    }

    /* Below 1024px: every option becomes one group per row */
    @media (max-width: 1023.98px) {
      .local-reach-figures--per-row-1 .local-reach-figures__group,
      .local-reach-figures--per-row-2 .local-reach-figures__group,
      .local-reach-figures--per-row-4 .local-reach-figures__group {
        flex: 0 0 100%;
        max-width: 100%;
        margin-inline-start: 0;
      }
    }

    .local-reach-figures__group {
      display: flex;
      flex-direction: column;
      border-inline-start: 5px solid var(--lr-line);
      padding-inline-start: 1rem;
      justify-content: space-between;
      padding-top: 12px;
      padding-bottom: 12px;
    }

    .local-reach-figures__title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0 0 0.75rem;
      color: #4f535a;
      font-size: 1.75rem;
      line-height: 1.2;
      font-weight: 700;
    }

    .local-reach-figures__icon {
      flex: 0 0 auto;
      width: 1.75rem;
      height: 1.75rem;
      background: var(--lr-icon) center / contain no-repeat;
    }

    .local-reach-figures__list {
      display: flex;
      flex-wrap: wrap;
      gap: 40px 2rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .local-reach-figures__item {
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    .local-reach-figures__number {
      color: var(--lr-number);
      font-size: 3rem;
      line-height: 1.1;
      font-weight: 400;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .local-reach-figures__description {
      margin-top: 0.25rem;
      color: #2d2f33;
      font-size: 1.125rem;
      line-height: 1.2;
      font-weight: 400;
    }

    @media (max-width: 1023.98px) {
      .local-reach-figures__title {
        font-size: 1.5rem;
      }
      .local-reach-figures__number {
        font-size: 3rem;
      }
      .local-reach-figures__description {
        font-size: 1rem;
      }
    }

    html[dir="rtl"] .local-reach-figures__number {
      text-align: right;
    }
