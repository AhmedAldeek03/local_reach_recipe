css:
  original: |
    .local-reach-count-up {
      display: inline-grid;
    }

    .local-reach-count-up__final,
    .local-reach-count-up__value {
      grid-area: 1 / 1;
      font-variant-numeric: tabular-nums;
    }

    .local-reach-count-up__final {
      opacity: 0;
    }

    .local-reach-bars {
      --lr-bg: #f2f7fb;
      --lr-line: #1f2a90;
      --lr-icon-bg: #b5dbe9;
      padding: 1.5rem;
      border-radius: 1.5rem;
      background: var(--lr-bg);
      box-sizing: border-box;
      margin-top: 60px;
    }

    .local-reach-bars__list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .local-reach-bars__item {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 0;
    }

    .local-reach-bars__icon {
      position: relative;
      flex: 0 0 auto;
      width: 4rem;
      height: 4rem;
      border-radius: 1rem;
      overflow: hidden;
      background: var(--lr-icon-bg);
    }
    .local-reach-bars__icon-img {
      position: absolute;
      inset: 0.8rem;
      background: var(--lr-icon) center / contain no-repeat;
    }

    .local-reach-bars__content {
      flex: 1 1 auto;
      min-width: 0;
    }

    .local-reach-bars__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .local-reach-bars__title {
      color: #4f535a;
      font-size: 1.5rem;
      line-height: 1.2;
      font-weight: 400;
    }

    .local-reach-bars__number {
      flex: 0 0 auto;
      color: var(--lr-line);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .local-reach-bars__track {
      position: relative;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--lr-icon-bg);
    }
    .local-reach-bars__fill {
      position: relative;
      height: 100%;
      border-radius: 999px;
      background: var(--lr-line);
    }
    @media (max-width: 1279.98px) {
      .local-reach-bars {
        margin-bottom: 24px;
      }
    }

    @media (max-width: 1023.98px) {
      .local-reach-bars__title {
        font-size: 1.25rem;
      }
      .local-reach-bars__number {
        font-size: 1.25rem;
      }
    }
