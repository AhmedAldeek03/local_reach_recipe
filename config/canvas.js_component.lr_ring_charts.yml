css:
  original: |
    .local-reach-count-up {
      display: inline-grid;
    }

    .local-reach-count-up__final,
    .local-reach-count-up__value {
      grid-area: 1 / 1;
      font-variant-numeric: tabular-nums;
    }

    .local-reach-count-up__final {
      opacity: 0;
    }

    .local-reach-rings {
      padding: 2.25rem;
      border-radius: 1.5rem;
      background: var(--lr-bg, #faf9f5);
      box-sizing: border-box;
    }

    /* Header styling */
    .local-reach-rings__header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 2rem;
      padding-left: 0.5rem;
    }

    .local-reach-rings__header-icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      border-radius: 0.75rem;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* Inner SVG image inside the wrapper */
    .local-reach-rings__header-icon {
      width: 2rem;
      height: 2rem;
      object-fit: contain;
      display: block;
    }

    .local-reach-rings__header-title {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
    }

    /* Flex items container */
    .local-reach-rings__items {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      row-gap: 2rem;
    }

    /* col-3: four charts per row. */
    .local-reach-ring {
      --lr-ring-color: #c0a84f;
      --lr-text-color: #c0a84f;
      /* Number falls back to the ring color if not set inline. */
      --lr-number-color: var(--lr-ring-color);
      flex: 0 0 25%;
      max-width: 25%;
      box-sizing: border-box;
      padding: 0 0.75rem;
      text-align: center;
    }

    .local-reach-ring__chart {
      position: relative;
      width: 100%;
      max-width: 159px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 0.5rem;
    }

    .local-reach-ring circle {
      fill: none;
      stroke: var(--lr-ring-color);
      stroke-width: 9.54;
    }

    .local-reach-ring__track {
      opacity: 0.3;
    }

    .local-reach-ring__chart > svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg); /* start at 12 o'clock */
    }

    .local-reach-ring__text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--lr-text-color);
    }

    .local-reach-ring__percent {
      font-size: 2.5rem;
      line-height: 1.2;
      font-weight: 400;
    }

    /* Only nudge the percentage down when a number is shown below it. */
    .local-reach-ring__percent:has(+ .local-reach-ring__number) {
      margin-top: 10px;
    }

    .local-reach-ring__number {
      font-size: 1.125rem;
      color: var(--lr-number-color);
    }

    .local-reach-ring__label {
      color: #2d2f33;
      font-size: 1.125rem;
      font-weight: 400;
      line-height: 1.2;
    }

    @media (max-width: 1279.98px) {
      .local-reach-rings {
        margin-top: 24px;
      }
    }

    @media (max-width: 1023.98px) {
      .local-reach-rings__header-title {
        font-size: 1.5rem;
      }
      .local-reach-ring__percent {
        font-size: 2.5rem;
      }
      .local-reach-ring__percent:has(+ .local-reach-ring__number) {
        margin-top: 0;
      }
      .local-reach-ring__number {
        font-size: 1rem;
      }
      .local-reach-ring__label {
        font-size: 1rem;
      }
      .local-reach-ring {
        flex-basis: 50%;
        max-width: 50%;
      }
    }

    @media (max-width: 640px) {
      .local-reach-ring {
        flex-basis: 100%;
        max-width: 100%;
      }
    }
