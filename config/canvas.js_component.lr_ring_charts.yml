langcode: en
status: true
dependencies: {  }
machineName: lr_ring_charts
name: 'Local Reach: Ring charts'
required:
  - labels
  - percentages
props:
  title:
    title: Title
    type: string
    examples:
      - 'Our impact'
  icon:
    title: Icon
    type: object
    $ref: 'json-schema-definitions://canvas.module/image'
    examples:
      -
        src: 'https://placehold.co/56x56@2x.png?text=Icon'
        width: 56
        height: 56
        alt: Icon
  iconBackground:
    title: 'Icon background color'
    type: string
    examples:
      - '#d0eefb'
  titleColor:
    title: 'Title color'
    type: string
    examples:
      - '#000000'
  background:
    title: 'Background color'
    type: string
    examples:
      - '#f9f5ee'
  labels:
    title: Labels
    type: array
    items:
      type: string
    examples:
      -
        - Women
        - Youth
        - Elderly
    minItems: 1
  percentages:
    title: 'Percentages (same order as labels)'
    type: array
    items:
      type: integer
    examples:
      -
        - 62
        - 45
        - 18
    minItems: 1
  numbers:
    title: 'Numbers under the percentage (optional, same order)'
    type: array
    items:
      type: integer
    examples:
      -
        - 3100
        - 2250
        - 900
  ringColor:
    title: 'Ring color'
    type: string
    examples:
      - '#be9f56'
  numberColor:
    title: 'Number color'
    type: string
    examples:
      - '#be9f56'
  textColor:
    title: 'Text color'
    type: string
    examples:
      - '#2d2f33'
slots: {  }
